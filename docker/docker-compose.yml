services:
  fsm_localisation:

    build:
      context: ..
      dockerfile: docker/Dockerfile

    image: li9i/fsm-localisation:lyrical
    container_name: fsm_localisation
    tty: true
    network_mode: "host"
    ipc: host

    volumes:
      - ./shared-input:/home/fsm_localisation/shared-input:rw
      - ./shared-output:/home/fsm_localisation/shared-output:rw
